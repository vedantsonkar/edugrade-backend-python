name: Backend CI and UAT deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests scripts alembic/env.py
      - name: Type check
        run: mypy app
      - name: Test
        run: python -m pytest
      - name: Validate deployment scripts
        run: |
          bash -n deploy/uat/deploy.sh
          python -m py_compile deploy/uat/*.py
      - name: Verify container build
        run: docker build --file docker/Dockerfile --tag edugrade-ci:${{ github.sha }} .

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://edugrade:edugrade@postgres:5432/edugrade
      REDIS_URL: redis://redis:6379/0
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edugrade
      POSTGRES_PASSWORD: edugrade
      POSTGRES_DB: edugrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugrade -d edugrade"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir /data -ip.bind 0.0.0.0
      -master.volumeSizeLimitMB 1024
      -volume.max 0 -s3 -s3.port 8333
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweeddata:/data
    restart: unless-stopped

volumes:
  pgdata:
  seaweeddata:

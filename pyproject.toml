[project]
name = "edugrade-backend"
version = "0.1.0"
description = "Standalone EduGrade backend: FastAPI + SQLAlchemy 2.0 async + PostgreSQL + Redis + SeaweedFS"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.6,<1.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uuid-utils>=0.10.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "google-genai>=0.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "types-boto3>=1.35.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# STRICT typing per AGENTS.md §4 — see that file for the policy.
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# `Any` escapes from ORM row tuples and some SDK stubs are handled via casts;
# anything else must be genuinely typed.
exclude = ["^alembic/versions/", "^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = ["google.genai.*", "boto3.*", "botocore.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "ANN",    # annotations (ANN401 bans Any)
    "D",      # pydocstyle — docstrings mandatory (AGENTS.md §5)
    "ASYNC",  # async correctness
    "PT",     # pytest style
    "RUF",    # ruff-specific
    "ERA",    # no commented-out code
    "PL",     # pylint
]
ignore = [
    "D203",    # one-blank-line-before-class — conflicts with D211
    "D213",    # multi-line-summary-second-line — conflicts with D212
    "PLR0913", # too-many-arguments — constructor injection (DIP) is intentional
    "PLR0917", # too-many-positional — same DI rationale as PLR0913
    "PLR2004", # magic values in tests mostly; review flags real ones
    "PLC0415", # import-outside-top-level — deliberate adapter-boundary pattern
               # (AGENTS.md §2-D: SDK imports stay local to adapter modules)
    "N803",    # lowercase `page`/`pageSize` route params mirror the wire contract
    "RUF012",  # mutable class defaults audited; only used in fakes/dataclasses
    "UP046",   # PEP-695 generics kept off while targeting 3.13 toolchain parity
    "PT018",   # composite assertions acceptable in integration tests
    "PT011",   # pytest.raises(ValueError) is precise enough for token fakes
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.ruff.lint.per-file-ignores]
# Test bodies stay lean; helpers/utilities still typed. Docstrings not required.
"tests/**" = ["D", "ANN", "PLR2004", "S101"]
# Alembic autogenerated revisions are exempt (hand-written ones must comply).
"alembic/versions/**" = ["D", "ANN", "E501", "ERA001"]
"scripts/**" = ["D100"]
